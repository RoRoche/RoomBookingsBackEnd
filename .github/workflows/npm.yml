name: NPM CI

on: [push, pull_request]

jobs:
  dependencies:
    name: Run npm commands
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependencies are up to date
        run: npx check-outdated
